<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrimeLine Beta</title>
<style>
:root{--bg:#08101c;--panel:#101b2c;--line:#24344c;--text:#f4f7fb;--muted:#91a0b8;--accent:#62d0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{max-width:820px;margin:auto;padding:22px 14px 90px}h1{margin:3px 0}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:900}p,.sub{color:var(--muted);font-size:13px}.panel,.game,.alert,.ticket{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip,.back,.primary,.badge{border:1px solid var(--line);border-radius:999px;background:#182942;color:#d5e0f1;padding:7px 11px;font-weight:700}.chip.sel{border-color:var(--accent);color:var(--accent)}select{background:#132238;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}.primary{border:0;border-radius:12px;background:var(--accent);color:#06121e;width:100%;margin-top:12px}.game{cursor:pointer}.league{font-size:10px;font-weight:900;letter-spacing:1.2px;color:var(--accent)}.marketstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.marketstrip span{background:#0b1625;border:1px solid #1b2a40;border-radius:10px;padding:8px;text-align:center}.marketstrip small{display:block;color:var(--muted);font-size:9px}.why{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.view{display:none}.view.active{display:block}.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#070d18;border-top:1px solid var(--line);display:flex;justify-content:center}.nav button{background:none;border:0;color:var(--muted);padding:15px 25px;font-weight:800}.nav button.active{color:var(--accent)}.finder{position:sticky;top:0;z-index:5;background:rgba(16,27,44,.96)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box{background:#0c1726;border-radius:12px;padding:10px}.box span{display:block;color:var(--muted);font-size:11px}@media(max-width:520px){.marketstrip,.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app">
<div class="eyebrow">PRIMELINE</div><h1>Know the line. Know the why.</h1>
<p>Live CFB + NFL intelligence. Unvalidated markets never enter Power Legs.</p>
<section id="home" class="view active"><div id="status" class="alert"><b>Checking data…</b></div>
<div class="panel finder"><div class="top"><div><h3>Today</h3><p class="sub">Validated markets only.</p></div><span id="refreshStamp" class="badge">Checking…</span></div>
<div id="modeFilters" class="filters"><button class="chip sel" data-mode="ALL">All</button><button class="chip" data-mode="LIVE">Live</button><button class="chip" data-mode="UPCOMING">Upcoming</button></div>
<div id="sportFilters" class="filters"><button class="chip sel" data-sport="ALL">All Games</button><button class="chip" data-sport="NFL">NFL</button><button class="chip" data-sport="CFB">College Football</button></div>
<div id="nflFilters" class="hidden"><select id="nflGroup"><option value="ALL">All NFL</option><option>AFC</option><option>NFC</option><option>AFC East</option><option>AFC North</option><option>AFC South</option><option>AFC West</option><option>NFC East</option><option>NFC North</option><option>NFC South</option><option>NFC West</option></select></div>
<div id="cfbFilters" class="hidden"><select id="cfbGroup"><option value="ALL">All College Football</option><option>SEC</option><option>Big Ten</option><option>Big 12</option><option>ACC</option><option>American</option><option>Mountain West</option><option>Sun Belt</option><option>MAC</option><option>Conference USA</option><option>Pac-12</option><option>Independent</option></select></div>
<p id="filterCount" class="sub"></p></div><div id="games"></div></section>
<section id="game" class="view"><button class="back" onclick="show('home')">← Back</button><div id="detail"></div></section>
<section id="build" class="view"><div class="panel"><h2>Power Legs</h2><p>Only active recommendations tied to their own validated market outcome are eligible.</p><select id="legCount"><option value="3">Spark · 3</option><option value="5">Boost · 5</option><option value="10">Momentum · 10</option><option value="15">Power · 15</option><option value="20">Prime Run · 20</option></select><select id="buildSport"><option value="ALL">CFB + NFL</option><option>NFL</option><option>CFB</option></select><button id="buildBtn" class="primary">Build Eligible Ticket</button></div><div id="ticket" class="ticket hidden"></div></section>
</div><nav class="nav"><button data-v="home" class="active">Board</button><button data-v="build">Build</button></nav>
<script src="market-validation.js"></script><script>
const SUPABASE_URL='https://zqoishcatboiandyftmb.supabase.co',SUPABASE_KEY='sb_publishable_6VfvIVCU7lBuhq305YeNAg_ODY2jcuc';
const {esc,tier,pairMarkets,recommendationValid}=PrimeLineValidation;
/* P0 kill switch: current SportsDataIO entitlement is returning Scrambled data and schema cannot prove standard/production markets. */
const TRUSTED_MARKETS_ENABLED=false;
let G=[],sportFilter='ALL',boardMode='ALL';
const NFL={ARI:['NFC','NFC West'],ATL:['NFC','NFC South'],BAL:['AFC','AFC North'],BUF:['AFC','AFC East'],CAR:['NFC','NFC South'],CHI:['NFC','NFC North'],CIN:['AFC','AFC North'],CLE:['AFC','AFC North'],DAL:['NFC','NFC East'],DEN:['AFC','AFC West'],DET:['NFC','NFC North'],GB:['NFC','NFC North'],HOU:['AFC','AFC South'],IND:['AFC','AFC South'],JAX:['AFC','AFC South'],KC:['AFC','AFC West'],LV:['AFC','AFC West'],LAC:['AFC','AFC West'],LAR:['NFC','NFC West'],MIA:['AFC','AFC East'],MIN:['NFC','NFC North'],NE:['AFC','AFC East'],NO:['NFC','NFC South'],NYG:['NFC','NFC East'],NYJ:['AFC','AFC East'],PHI:['NFC','NFC East'],PIT:['AFC','AFC North'],SEA:['NFC','NFC West'],SF:['NFC','NFC West'],TB:['NFC','NFC South'],TEN:['AFC','AFC South'],WAS:['NFC','NFC East']};
const CFB={
SEC:['TX','TENN','MISS','FL','OKL','GA','VAND','AUBRN','SC','ALA','TXAM','LSU','MISSR','MSPST','ARK','UK'],
'Big Ten':['ILL','OHIOST','UCLA','MARY','PUR','IOWA','MICH','WISC','PENNST','NEBR','MST','ORE','USC','MINNST','WASH','IND','NW','RUTGER'],
'Big 12':['ARZ','ARZST','BAYL','BYU','CIN','COL','HOU','IOWAST','KAN','KANST','OKST','TCU','TXTECH','UCF','UTAH','WVIR'],
ACC:['BOSCOL','CAL','CLMSN','DUKE','FLST','GTECH','LOU','MIA','NCAR','NCST','PITT','SMU','STAN','SYRA','VIR','VTECH','WAKE'],
American:['ARMY','CHARLT','ECAR','FLATL','MPHS','NAVY','NTX','RICE','SFL','TEMPL','TULANE','TULSA','UAB','UTSA'],
'Mountain West':['AFA','BOISE','COLST','FREST','HAWAII','NEVADA','NMX','SDST','SJST','UNLV','UTAHST','WYOM'],
'Sun Belt':['APPLST','ARKST','COAST','GAS','GAST','JMAD','LAMON','LOULAF','MARSH','OLD','SALA','SOUMIS','TXST','TROY'],
MAC:['AKRON','BALLST','BOWLGR','BUF','CMICH','EMICH','KENTST','MIAOH','NILL','OHIO','TOLEDO','WMICH'],
'Conference USA':['DEL','FIU','JAXST','KENEST','LIBRTY','LOUTCH','MTSU','NMXST','SHSU','UTEP','WKENT'],
'Pac-12':['OREGST','WASHST'],Independent:['ND','UCONN','UMASS']
};
function cfbConference(k){for(const [c,t] of Object.entries(CFB))if(t.includes(k))return c;return null}
function cfbConferences(a,h){return [...new Set([cfbConference(a),cfbConference(h)].filter(Boolean))]}
async function sb(path,range){const h={apikey:SUPABASE_KEY};if(range)h.Range=range;const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:h});if(!r.ok)throw Error('Data feed '+r.status);return r.json()}
async function sbAll(path){const out=[];for(let from=0;;from+=1000){const rows=await sb(path,from+'-'+(from+999));out.push(...rows);if(rows.length<1000)break}return out}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===id));scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>show(x.dataset.v));
function visibleGames(){let a=G;if(boardMode==='LIVE')a=a.filter(g=>g.isLive);if(boardMode==='UPCOMING')a=a.filter(g=>!g.started);if(sportFilter!=='ALL')a=a.filter(g=>g.sport===sportFilter);if(sportFilter==='NFL'&&nflGroup.value!=='ALL')a=a.filter(g=>(NFL[g.awayKey]||[]).includes(nflGroup.value)||(NFL[g.homeKey]||[]).includes(nflGroup.value));if(sportFilter==='CFB'&&cfbGroup.value!=='ALL')a=a.filter(g=>g.conferences.includes(cfbGroup.value));return a}
const cell=(label,value,meta)=>'<span><small>'+esc(label)+'</small><b>'+esc(value)+'</b>'+(meta?'<small>'+esc(meta)+'</small>':'')+'</span>';
function render(){const a=visibleGames();filterCount.textContent=a.length+' games';games.innerHTML=a.map(g=>'<div class="game" onclick="openG(\''+esc(g.id)+'\')"><div class="top"><div><div class="league">'+esc(g.sport+(g.conference?' · '+g.conference:''))+'</div><b>'+esc(g.title)+'</b><div class="sub">'+esc(g.when)+'</div></div><span class="badge">'+esc(g.isLive?'LIVE':g.started?'Started':g.recTier||'Pregame')+'</span></div><div class="marketstrip">'+cell(g.awayKey+' ML',g.awayML,g.mlMeta)+cell(g.homeKey+' ML',g.homeML,g.mlMeta)+cell('Spread',g.awaySpread,g.spreadMeta)+cell('Total',g.total,g.totalMeta)+'</div>'+(g.pick?'<div class="why"><b>'+esc(g.pick)+'</b> · '+esc(g.recTier)+'</div>':'')+'<div class="why"><b>'+esc(g.marketMessage)+'</b></div></div>').join('')||'<div class="panel">No games here.</div>'}
function openG(id){const g=G.find(x=>x.id===id);if(!g)return;detail.innerHTML='<div class="panel"><div class="eyebrow">'+esc(g.sport)+'</div><h2>'+esc(g.title)+'</h2><p>'+esc(g.when)+'</p><div class="grid"><div class="box"><span>Market status</span><b>'+esc(g.marketMessage)+'</b></div><div class="box"><span>PrimeLine</span><b>'+esc(g.pick||'Unavailable')+'</b></div></div><p>Venue: '+esc(g.venue||'Pending')+'</p><p>Conference/group: '+esc(g.conference||'—')+'</p></div>';show('game')}
document.querySelectorAll('#modeFilters .chip').forEach(b=>b.onclick=()=>{boardMode=b.dataset.mode;document.querySelectorAll('#modeFilters .chip').forEach(x=>x.classList.toggle('sel',x===b));render()});
document.querySelectorAll('#sportFilters .chip').forEach(b=>b.onclick=()=>{sportFilter=b.dataset.sport;document.querySelectorAll('#sportFilters .chip').forEach(x=>x.classList.toggle('sel',x===b));nflFilters.classList.toggle('hidden',sportFilter!=='NFL');cfbFilters.classList.toggle('hidden',sportFilter!=='CFB');render()});nflGroup.onchange=render;cfbGroup.onchange=render;
async function load(){
 try{
  const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+3);
  const gs=await sbAll('games?select=id,sport,away_team_name,home_team_name,away_team_key,home_team_key,scheduled_at,venue_name,status,away_score,home_score&sport=in.(CFB,NFL)&scheduled_at=gte.'+encodeURIComponent(start.toISOString())+'&scheduled_at=lt.'+encodeURIComponent(end.toISOString())+'&order=scheduled_at.asc');
  const ids=gs.map(x=>x.id),by={};
  if(TRUSTED_MARKETS_ENABLED){
   for(let i=0;i<ids.length;i+=12){const rows=await sbAll('game_markets?select=game_id,market_type,side,line,american_odds,observed_at,is_live,is_available,sportsbook_id,provider_market_id,provider_outcome_id,sportsbook:sportsbooks(name,key)&game_id=in.('+ids.slice(i,i+12).join(',')+')&period=eq.full_game&order=observed_at.desc');for(const m of rows){m.sportsbook_name=m.sportsbook?.name;m.is_alternate=false;m.entitlement=null;m.provider_updated_at=m.observed_at;(by[m.game_id]??=[]).push(m)}}
  }
  let recs=[];if(ids.length)recs=await sbAll('prime_recommendations?select=game_id,sportsbook_id,market_type,side,line,selection_label,confidence,status,rationale&game_id=in.('+ids.join(',')+')&status=eq.active&order=confidence.desc');
  const rb={};for(const r of recs)(rb[r.game_id]??=[]).push(r);
  G=gs.map(g=>{const rows=by[g.id]||[],pairs=TRUSTED_MARKETS_ENABLED?{moneyline:pairMarkets(rows,'moneyline',['away','home'],g.sport),spread:pairMarkets(rows,'spread',['away','home'],g.sport),total:pairMarkets(rows,'total',['over','under'],g.sport)}:{},rec=(rb[g.id]||[]).find(r=>recommendationValid(r,pairs)),kick=new Date(g.scheduled_at),st=String(g.status||'').toLowerCase(),isLive=st==='live'||st.includes('progress')||st.includes('half'),started=kick<=new Date()||isLive||st==='final'||st==='closed',marketCount=Object.values(pairs).filter(Boolean).length,meta=p=>p?((p.away||p.over).sportsbook_name+' · odds as of '+new Date((p.away||p.over).observed_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})):'';
   return{id:g.id,sport:g.sport,awayKey:g.away_team_key,homeKey:g.home_team_key,title:(g.away_team_name||g.away_team_key)+' @ '+(g.home_team_name||g.home_team_key),when:kick.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}),isLive,started,venue:g.venue_name,conference:g.sport==='CFB'?(cfbConference(g.home_team_key)||cfbConference(g.away_team_key)):null,conferences:g.sport==='CFB'?cfbConferences(g.away_team_key,g.home_team_key):[],marketCount,eligible:!started&&!!rec,pick:rec?.selection_label||null,recTier:rec?tier(Number(rec.confidence)):null,awayML:pairs.moneyline?String(pairs.moneyline.away.american_odds):'—',homeML:pairs.moneyline?String(pairs.moneyline.home.american_odds):'—',awaySpread:pairs.spread?String(pairs.spread.away.line)+' ('+pairs.spread.away.american_odds+')':'—',total:pairs.total?'O '+pairs.total.over.line+' ('+pairs.total.over.american_odds+')':'—',mlMeta:meta(pairs.moneyline),spreadMeta:meta(pairs.spread),totalMeta:meta(pairs.total),marketMessage:marketCount?'Validated market data available':'Awaiting validated market data'};
  });
  const validated=G.reduce((n,g)=>n+g.marketCount,0);
  status.innerHTML='<b>'+esc(validated+' validated markets')+'</b><p>'+esc(G.filter(x=>x.isLive).length+' live · '+G.filter(x=>!x.started).length+' upcoming · '+G.filter(x=>x.eligible).length+' ticket eligible')+'</p>';
  refreshStamp.textContent='Checked '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render();
 }catch(e){status.textContent='Data check failed. No betting data will be substituted.';G=[];render()}
}
buildBtn.onclick=()=>{const n=+legCount.value,s=buildSport.value,p=G.filter(g=>g.eligible&&g.pick&&(s==='ALL'||g.sport===s)).slice(0,n);ticket.classList.remove('hidden');ticket.innerHTML=p.length?'<ol>'+p.map(g=>'<li><b>'+esc(g.pick)+'</b> · '+esc(g.recTier)+' · '+esc(g.title)+'</li>').join('')+'</ol>'+(p.length<n?'<p>Only '+p.length+' validated active recommendations are available. Ticket was not padded.</p>':''):'<b>No eligible validated legs right now.</b><p>PrimeLine will not substitute or pad tickets.</p>'};
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
