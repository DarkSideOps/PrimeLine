<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeLine Beta</title><style>:root{--bg:#08101c;--panel:#101b2c;--line:#24344c;--text:#f4f7fb;--muted:#91a0b8;--accent:#62d0ff;--good:#45d480;--warn:#f1c75b}*{box-sizing:border-box}body{margin:0;background:#08101c;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:22px 14px 90px}h1{margin:3px 0;font-size:30px}h2,h3{margin:0}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:900}p,.sub{color:var(--muted);font-size:13px}.panel,.game,.alert,.ticket{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}.alert{background:#12223a}.row,.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.box{background:#0c1726;border-radius:12px;padding:10px}.box span{display:block;color:var(--muted);font-size:11px}.box b{font-size:14px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip,.back,.primary{border:1px solid var(--line);border-radius:999px;background:#182942;color:#d5e0f1;padding:7px 11px;font-weight:700}.chip.sel{border-color:var(--accent);color:var(--accent)}select{background:#132238;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;margin-top:5px}.primary{border:0;border-radius:12px;background:var(--accent);color:#06121e;width:100%;margin-top:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px}.good{color:#a9f1c7}.warn{color:#ffe39a}.game{cursor:pointer}.conf{font-size:23px;font-weight:900}.view{display:none}.view.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#070d18;border-top:1px solid var(--line);display:flex;justify-content:center}.nav button{background:none;border:0;color:var(--muted);padding:15px 25px;font-weight:800}.nav button.active{color:var(--accent)}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.nav button{padding:14px 18px}}</style></head><body><div class="app"><div class="eyebrow">PRIMELINE</div><h1>Know the line. Know the why.</h1><p>Live CFB + NFL intelligence. Started games are browseable only and can never enter a new Power Leg.</p><section id="home" class="view active"><div id="status" class="alert"><b>Loading live board…</b></div><div class="panel"><h3>Find Games</h3><div id="sportFilters" class="filters"><button class="chip sel" data-sport="ALL">All Games</button><button class="chip" data-sport="NFL">NFL</button><button class="chip" data-sport="CFB">College Football</button></div><div id="nflFilters" class="hidden"><label class="sub">NFL conference / division</label><select id="nflGroup"><option value="ALL">All NFL</option><option>AFC</option><option>NFC</option><option>AFC East</option><option>AFC North</option><option>AFC South</option><option>AFC West</option><option>NFC East</option><option>NFC North</option><option>NFC South</option><option>NFC West</option></select></div><div id="cfbFilters" class="hidden"><label class="sub">College group</label><select id="cfbGroup"><option value="ALL">All College Football</option><option value="TOP25">Top 25</option><option>SEC</option><option>Big Ten</option><option>Big 12</option><option>ACC</option><option>American</option><option>Mountain West</option><option>Sun Belt</option><option>MAC</option><option>Conference USA</option><option>Pac-12</option><option>Independent</option></select></div><p id="filterCount" class="sub"></p></div><div id="games"></div></section><section id="game" class="view"><button class="back" onclick="show('home')">← Back</button><div id="detail"></div></section><section id="build" class="view"><div class="panel"><h2>Power Legs</h2><p>Only future games with currently available markets are eligible.</p><label class="sub">Ticket size</label><select id="legCount"><option value="3">Spark · 3</option><option value="5" selected>Boost · 5</option><option value="10">Momentum · 10</option><option value="15">Power · 15</option><option value="20">Prime Run · 20</option></select><label class="sub">Sport</label><select id="buildSport"><option value="ALL">CFB + NFL</option><option>NFL</option><option>CFB</option></select><button id="buildBtn" class="primary">Build Eligible Ticket</button></div><div id="ticket" class="ticket hidden"></div></section></div><nav class="nav"><button data-v="home" class="active">Board</button><button data-v="build">Build</button></nav><script>const SUPABASE_URL='https://zqoishcatboiandyftmb.supabase.co',SUPABASE_KEY='sb_publishable_6VfvIVCU7lBuhq305YeNAg_ODY2jcuc';let G=[],sportFilter='ALL';const NFL={ARI:['NFC','NFC West'],ATL:['NFC','NFC South'],BAL:['AFC','AFC North'],BUF:['AFC','AFC East'],CAR:['NFC','NFC South'],CHI:['NFC','NFC North'],CIN:['AFC','AFC North'],CLE:['AFC','AFC North'],DAL:['NFC','NFC East'],DEN:['AFC','AFC West'],DET:['NFC','NFC North'],GB:['NFC','NFC North'],HOU:['AFC','AFC South'],IND:['AFC','AFC South'],JAX:['AFC','AFC South'],KC:['AFC','AFC West'],LV:['AFC','AFC West'],LAC:['AFC','AFC West'],LAR:['NFC','NFC West'],MIA:['AFC','AFC East'],MIN:['NFC','NFC North'],NE:['AFC','AFC East'],NO:['NFC','NFC South'],NYG:['NFC','NFC East'],NYJ:['AFC','AFC East'],PHI:['NFC','NFC East'],PIT:['AFC','AFC North'],SEA:['NFC','NFC West'],SF:['NFC','NFC West'],TB:['NFC','NFC South'],TEN:['AFC','AFC South'],WAS:['NFC','NFC East']};;const CFB={SEC:['TEX','TENN','MISS','FLA','OU','UGA','VAN','AUB','SC','ALA','TA&M','LSU','MIZ','MSST','ARK','UK'], 'Big Ten':['ILL','OSU','UCLA','MD','PUR','IOWA','MICH','WIS','PSU','NEB','MSU','ORE','USC','MINN','WASH','IND','NW','RUT'], 'Big 12':['COLO','BAY','TTU','UTAH','ISU','TCU','UCF','HOU','KSU','CIN','OKST','WVU','ARIZ'], ACC:['VT','BC','WAKE','LOU','PITT','FSU','DUKE','UVA','MIA','NCSU','SMU','GT','STAN'], American:['UTSA','ECU','USF','TULN','UNT','FAU','TLSA'], 'Mountain West':['UNLV','SDSU','BOISE','WYO','USU','FRES','AFA','NEV','HAW'], 'Sun Belt':['USA','GASO','APP','ARST','JMU','ODU','ULM','TROY','TXST','USM','MARSH'], MAC:['AKR','TOL','BALL','KENT','EMU','CMU','WMU','M-OH','BUFF','OHIO','BGSU','NIU'], 'Conference USA':['SHSU','NMSU','FIU','KENN','WKU','MTSU','JVST','MOST','UTEP'], 'Pac-12':['WSU','ORST'], Independent:['ND','UCONN','UMASS']};const CFB_TOP25=new Set(['TEX','UGA','ND','MISS','MIA','OSU','ALA','LSU','TTU','USC','PSU','TENN','LOU','UTAH','IOWA','MICH','ORE','MIZ','SMU','TA&M','MSST','FLA','HOU']);function cfbConference(k){for(const [conf,teams] of Object.entries(CFB))if(teams.includes(k))return conf;return null}async function sb(p){const r=await fetch(SUPABASE_URL+'/rest/v1/'+p,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw Error('Data feed '+r.status);return r.json()}const validAmerican=o=>o!=null&&Number.isFinite(Number(o))&&Math.abs(Number(o))>=100&&Math.abs(Number(o))<=5000;const odds=o=>validAmerican(o)?(Number(o)>0?'+':'')+Number(o):'—';const line=m=>m&&m.line!=null?m.line+(validAmerican(m.american_odds)?' ('+odds(m.american_odds)+')':''):'—';function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===id));scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>show(x.dataset.v));function visibleGames(){let a=G;if(sportFilter!=='ALL')a=a.filter(g=>g.sport===sportFilter);if(sportFilter==='NFL'&&nflGroup.value!=='ALL')a=a.filter(g=>(NFL[g.awayKey]||[]).includes(nflGroup.value)||(NFL[g.homeKey]||[]).includes(nflGroup.value));if(sportFilter==='CFB'&&cfbGroup.value!=='ALL'){const v=cfbGroup.value;if(v==='TOP25')a=a.filter(g=>g.top25);else a=a.filter(g=>g.conference===v)}return a}function render(){const a=visibleGames();filterCount.textContent=a.length+' games shown';games.innerHTML=a.map(g=>'<div class="game" onclick="openG(\''+g.id+'\')"><div class="top"><div><b>'+g.title+'</b><div class="sub">'+g.when+(g.started?' · STARTED':'')+'</div></div><div class="conf">'+(g.confidence??'LIVE')+'</div></div><div class="grid"><div class="box"><span>'+g.awayKey+' ML</span><b>'+g.awayML+'</b></div><div class="box"><span>'+g.homeKey+' ML</span><b>'+g.homeML+'</b></div><div class="box"><span>Spread</span><b>'+g.awayKey+' '+g.awaySpread+'</b></div><div class="box"><span>Total</span><b>'+g.total+'</b></div></div><p>'+(g.pick||'Market intelligence live')+'</p><span class="badge '+(g.eligible?'good':'warn')+'">'+(g.eligible?'Ticket eligible':'Browse only')+'</span></div>').join('')||'<div class="panel"><p>No games match this filter.</p></div>'}function openG(id){const g=G.find(x=>x.id===id);detail.innerHTML='<div class="panel"><div class="eyebrow">'+g.sport+'</div><h2>'+g.title+'</h2><p>'+g.when+'</p><div class="grid"><div class="box"><span>'+g.awayKey+' ML</span><b>'+g.awayML+'</b></div><div class="box"><span>'+g.homeKey+' ML</span><b>'+g.homeML+'</b></div><div class="box"><span>'+g.awayKey+' spread</span><b>'+g.awaySpread+'</b></div><div class="box"><span>'+g.homeKey+' spread</span><b>'+g.homeSpread+'</b></div><div class="box"><span>Total</span><b>'+g.total+'</b></div><div class="box"><span>PrimeLine</span><b>'+(g.pick||'Pending')+'</b></div></div><p>'+(g.eligible?'This game is eligible for new tickets.':'This game is not eligible for new tickets because kickoff has passed or no active market is available.')+'</p></div><div class="panel"><h3>Game Intelligence</h3><p>Venue: '+(g.venue||'Pending')+'</p><p>Conference/group: '+(g.conference||'—')+'</p><p>Current market data is shown above; PrimeLine recommendations layer in only when active.</p></div>';show('game')}document.querySelectorAll('#sportFilters .chip').forEach(b=>b.onclick=()=>{sportFilter=b.dataset.sport;document.querySelectorAll('#sportFilters .chip').forEach(x=>x.classList.toggle('sel',x===b));nflFilters.classList.toggle('hidden',sportFilter!=='NFL');cfbFilters.classList.toggle('hidden',sportFilter!=='CFB');render()});nflGroup.onchange=render;cfbGroup.onchange=render;async function load(){try{const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+3);const gs=await sb('games?select=id,sport,away_team_name,home_team_name,away_team_key,home_team_key,scheduled_at,venue_name&sport=in.(CFB,NFL)&scheduled_at=gte.'+encodeURIComponent(start.toISOString())+'&scheduled_at=lt.'+encodeURIComponent(end.toISOString())+'&order=scheduled_at.asc&limit=300');const ids=gs.map(x=>x.id);let parts=[];for(let i=0;i<ids.length;i+=12)parts.push(await sb('game_markets?select=game_id,market_type,side,line,american_odds,observed_at,is_live,is_available&game_id=in.('+ids.slice(i,i+12).join(',')+')&period=eq.full_game&is_available=eq.true&order=observed_at.desc&limit=5000'));const ms=parts.flat(),by={};ms.forEach(m=>(by[m.game_id]??=[]).push(m));let recs=[];if(ids.length)recs=await sb('prime_recommendations?select=game_id,selection_label,confidence,confidence_tier,status&game_id=in.('+ids.join(',')+')&status=in.(active,watch,recheck)&order=confidence.desc&limit=500');const rb={};recs.forEach(r=>(rb[r.game_id]??=[]).push(r));G=gs.map(g=>{const a=by[g.id]||[],latest=(t,s)=>a.find(m=>m.market_type===t&&m.side===s&&!m.is_live&&(t!=='moneyline'||validAmerican(m.american_odds))),aml=latest('moneyline','away'),hml=latest('moneyline','home'),asp=latest('spread','away'),hsp=latest('spread','home'),tot=latest('total','over')||latest('total','under'),r=(rb[g.id]||[])[0],kick=new Date(g.scheduled_at),started=kick<=new Date(),hasMarket=!!(aml||hml||asp||hsp||tot);return{id:g.id,sport:g.sport,title:(g.away_team_name||g.away_team_key)+' @ '+(g.home_team_name||g.home_team_key),awayKey:g.away_team_key,homeKey:g.home_team_key,when:kick.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}),scheduledAt:g.scheduled_at,started,eligible:!started&&hasMarket,awayML:odds(aml?.american_odds),homeML:odds(hml?.american_odds),awaySpread:line(asp),homeSpread:line(hsp),total:tot?((tot.side==='over'?'O ':'U ')+line(tot)):'—',pick:r?.selection_label,confidence:r?.confidence,venue:g.venue_name,conference:cfbConference(g.home_team_key)||cfbConference(g.away_team_key),top25:CFB_TOP25.has(g.home_team_key)||CFB_TOP25.has(g.away_team_key),markets:a}});status.innerHTML='<b>Live board connected</b><p>'+G.length+' games loaded. '+G.filter(x=>x.eligible).length+' are currently ticket-eligible. Started games are automatically excluded from Power Legs.</p>';render()}catch(e){status.innerHTML='<b>Live feed unavailable</b><p>'+e.message+'. No demo picks will be substituted.</p>';G=[];render()}}buildBtn.onclick=()=>{const n=+legCount.value,s=buildSport.value,candidates=G.filter(g=>g.eligible&&(s==='ALL'||g.sport===s)).sort((a,b)=>(b.confidence||0)-(a.confidence||0));const picks=[];for(const g of candidates){if(picks.length>=n)break;if(g.pick)picks.push([g.pick,g.confidence||'—',g.title]);else if(g.homeML!=='—')picks.push([g.homeKey+' ML','Market',g.title]);else if(g.awayML!=='—')picks.push([g.awayKey+' ML','Market',g.title])}ticket.classList.remove('hidden');if(!picks.length){ticket.innerHTML='<b>No eligible legs right now.</b><p>PrimeLine will not substitute expired or demo games.</p>';return}ticket.innerHTML='<div class="top"><h3>'+picks.length+'-Leg Eligible Ticket</h3><span class="badge good">Future games only</span></div><ol>'+picks.map(p=>'<li><b>'+p[0]+'</b><div class="sub">'+p[2]+' · '+p[1]+'</div></li>').join('')+'</ol>'+(picks.length<n?'<p class="warn">Only '+picks.length+' eligible legs are currently available; PrimeLine did not pad the ticket with stale selections.</p>':'')};load();</script></body></html>
